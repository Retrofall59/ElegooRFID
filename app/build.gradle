plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tomyn.elegoorfid'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.tomyn.elegoorfid"
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName "0.23-fix-planche-grille"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // QR code sur les etiquettes (v0.18, PlancheEtiquettes.kt) - pure Java, aucune dependance
    // Android supplementaire, juste la matrice de modules (QRCodeWriter + BitMatrix), dessinee a
    // la main avec le Canvas/Paint deja utilises pour le reste de l'etiquette.
    implementation 'com.google.zxing:core:3.5.3'
}
