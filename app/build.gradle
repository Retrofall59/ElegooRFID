plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tomyn.elegoorfid'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.tomyn.elegoorfid"
        minSdk 26
        targetSdk 34
        versionCode 35
        versionName "0.35-qr-rendu-bitmap"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // QR code sur les etiquettes (v0.18, PlancheEtiquettes.kt) - pure Java, aucune dependance
    // Android supplementaire, juste la matrice de modules (QRCodeWriter + BitMatrix), dessinee a
    // la main avec le Canvas/Paint deja utilises pour le reste de l'etiquette. Reutilisee en v0.29
    // pour le DECODAGE cote camera (ScanQrActivity.kt).
    implementation 'com.google.zxing:core:3.5.3'
    // Scan QR via la camera (v0.29, voir ScanQrActivity.kt) : previsualisation + analyse d'image.
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
}
